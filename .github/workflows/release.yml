name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other's artifacts.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: macos-14
            script: dist:mac
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        # Regenerated rather than trusted from the repo, so the committed
        # build/icon.png and the shipped .ico/.icns can never drift apart.
        run: npm run icons

      - name: Build
        # The npm scripts already pass --publish never. Do NOT add the flag here
        # as well: electron-builder would then see --publish twice, parse it as
        # the array ["never","never"], and its guard `publish !== "never"` would
        # evaluate true -- turning publishing ON and failing the build with
        # "GitHub Personal Access Token is not set".
        run: npm run ${{ matrix.script }}
        env:
          # Nothing is code-signed: no Apple Developer account, and no Windows
          # certificate. Set CSC_IDENTITY_AUTO_DISCOVERY=false so electron-builder
          # does not fail trying to find a signing identity on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Only the distributables -- not win-unpacked/ or mac/ (hundreds of MB).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec mv {} release/ \;
          echo '--- files to publish ---'
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          body: |
            从下方附件中选择对应平台的文件。

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows | `...-Setup-<version>.exe` | 安装包。按当前用户安装，无需管理员权限。 |
            | Windows | `...-Portable-<version>.exe` | 免安装单文件。 |
            | macOS | `...-arm64.dmg` | Apple Silicon（M 系列芯片）。 |
            | macOS | `...-<version>.dmg` | Intel 芯片。 |

            **不确定自己的 Mac 是哪种？** 点左上角苹果菜单 → 关于本机。窗口里显示「芯片」一行
            （M 系列芯片）就选 `arm64` 那个；显示「处理器」一行且是 Intel Core，就选另一个。

            **macOS 首次打开** —— 这两个构建**未签名、未公证**，macOS 首次会拒绝打开。
            把应用拖进 `/Applications`，然后**右键点击应用 → 打开**并确认。只需做一次。

            **Windows SmartScreen** —— 安装包未签名，可能提示「Windows 已保护你的电脑」。
            点 *更多信息* → *仍要运行*。
